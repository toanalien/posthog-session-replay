name = "urchin-session-replay"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"

# Cloudflare D1 Database binding for Metadata & Search
[[d1_databases]]
binding = "DB"
database_name = "urchin-db"
database_id = "local-urchin-db-id"

# Cloudflare R2 Bucket binding for Raw Replay Snapshot Storage
[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "urchin-snapshots"

[site]
bucket = "./dist"
